{{> header title="New Venue" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="New Venue" }}

<div class="ma1">
    <form class="submitonce" action="/venues" method="POST" enctype="multipart/form-data">
        <div class="formfields">
            <label for="name">*Name:</label>
            <input type="text" name="name" id="name" required>
            <label for="address">*Street Address:</label>
            <input type="text" name="address" id="address" required>
            <label for="city">City:</label>
            <input type="text" name="city" id="city">
            <label for="state">State:</label>
            <input type="text" name="state" id="state">
            <label for="zip">Zip:</label>
            <input type="text" name="zip" id="zip">
            <label for="latitude">Latitude:</label>
            <input type="text" name="latitude" id="latitude">
            <label for="longitude">Longitude:</label>
            <input type="text" name="longitude" id="longitude">
            <label for="phone">Phone:</label>
            <input type="text" name="phone" id="phone">
            <label for="email">Email:</label>
            <input type="text" name="email" id="email">
            <label for="website">Website:</label>
            <input type="text" name="website" id="website">

            {{#each questions}}
                {{> answer-edit item=this }}
            {{/each}}
        </div>

        <h3>Events:</h3>

        <div class="flex flex-column gap-1">
          <div>
            <label><input name="allcalendars" id="allcalendars" type="checkbox" checked="{{ allcalendars }}"><i>All Events</i></label>
          </div>
          {{#each events}}
          <div class="flex flex-column">
            <label>
              <input name="c_{{id}}" type="checkbox" checked="{{ active }}">{{name}}
            </label>
            <div>{{ startdate }} - {{ enddate }}</div>
            <div>{{ notes }}</div>
          {{/each}}
        </div>
        
        <div class="flex flex-row justify-center">
            <button type="submit" style="width: min(95vw, 22em); margin: 1em 0;">Save</button>
        </div>
    </form>
</div>
