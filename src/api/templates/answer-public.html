{{#with item}}
    <div class="qa">
      {{#if answerHTML}}
        {{{ answerHTML }}}
      {{else}}
        <span class="question">{{ question }}:</span>
        <span class="answer">{{ answer }}</span>
      {{/if}}
    </div>

    {{#if children}}
        <details class="children">
            <div class="answers">
                {{#each children}}
                    {{#if ispublic}}
                        {{> answer-public item=this }}
                    {{/if}}
                {{/each}}
            </div>
        </details>
    {{/if}}
{{/with}}
