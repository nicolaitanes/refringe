{{> header title="All Venues" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="All Venues" }}

<div class="ma1">
    <h3>All Venues</h3>
    
    <table class="table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Updated</th>
        </tr>
        </thead>
        <tbody>
        {{#each venues}}
        <tr>
            <td><a href="/venues/{{id}}">{{name}}</a></td>
            <td>{{updated}}</td>
        </tr>
        {{/each}}
        </tbody>
    </table>
</div>
