{{> header title="All Proposals - Allentown ReFringe" }}
{{> breadcrumb title="All Proposals" }}

<div class="ma1">
    <h3>All Proposals</h3>
    
    <table class="table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Status</th>
            <th>Updated</th>
        </tr>
        </thead>
        <tbody>
        {{#each venues}}
        <tr>
            <td><a href="/venues/{{id}}">{{name}}</a></td>
            <td>{{status}}</td>
            <td>{{updated}}</td>
        </tr>
        {{/each}}
        </tbody>
    </table>
</div>
