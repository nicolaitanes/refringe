{{> header title="map" sitename=sitename opengraph=opengraph }}

<script>
  window.key = `{{ key }}`;
  window.venueid = `{{ venueid }}`;
  window.venues = JSON.parse(`{{{ venues }}}`);
  window.pubcalendar = JSON.parse(`{{{ pubcalendar }}}`);
  window.calendar = JSON.parse(`{{{ calendar }}}`);
</script>


<link rel="stylesheet" href="/leaflet.css">
<script src="/js/leaflet.js"></script>

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
}
body {
    --bg-color: white;
    --fg-color: black;
    --link-color: rgb(84, 84, 243);
    --orgnote-color: #a00;
    --head-color: var(--fg-color);
    --subhead-color: var(--fg-color);
    --subhead2-color: var(--fg-color);
    --subhead3-color: var(--fg-color);
    --showhead-color: var(--fg-color);
    --atvenue-color: var(--fg-color);
    --times-color: var(--fg-color);
    --description-color: var(--fg-color);
    background: var(--bg-color);
    color: var(--fg-color);
    font-family: sans-serif;
}
@media (prefers-color-scheme: dark) {
    body {
      --bg-color: #222;
      --fg-color: #bbb;
      --link-color: #ddf;
      --orgnote-color: #fcc;
    }
}
a,
a:visited,
a:active,
a:hover {
    color: var(--link-color);
}
#map {
    width: 100vw;
    height: 75vh;
    height: 75cvh;
}
nav {
    position: absolute;
    top: .5em;
    right: .5em;
    z-index: 999;
    font-size: 200%;
    background: rgba(.5,.5,.5,.5);
    border-radius: 50%;
    padding: .25em;
}
nav a {
    text-decoration: none;
}
.ui {
    padding: .5em;
}
h3 {
    padding: 0;
}
</style>

<div id="map"></div>
<div class="ui"></div>

<script type="module">
        import { html, reactive } from 'arrow-js';

        const urlSearch = new URLSearchParams(location.hash?.slice(1));
        window.venueid = urlSearch.has('venue') ? +urlSearch.get('venue') : null;

        const venuesByID = {};
        for (const venue of venues) {
            venuesByID[venue.id] = venue;
        }
        window.venues = window.venues.filter(v => {
            if (v.latitude) return true;
            delete venuesByID[v.id];
            if (venueid === v.id) window.venueid = null;
        });

        const state = reactive({
            latitude: venuesByID[venueid]?.latitude ?? 42.899,
            longitude: venuesByID[venueid]?.longitude ?? -78.8765,
            venues: venues.sort((a, b) => a.name?.localeCompare(b.name)),
            venueid
        });

        const map = L.map('map').setView([state.latitude, state.longitude], 15 + 2*(!!venueid));
        const box = document.getElementById('map');
        L.tileLayer( 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        const maxCount = 5; // venue per dot
        const relaxation = Math.log(.5) * 2 / maxCount;
        let circles = [];

        const renderMap = () => {
            const bounds = map.getBounds();
            const radiusMiles = 0.5 * Math.sqrt(
                (53 * (bounds.getEast() - bounds.getWest()))**2 +
                (69 * (bounds.getNorth() - bounds.getSouth())**2)
            );
            const radiusPix = .5 * Math.sqrt(box.clientWidth**2 + box.clientHeight**2);
            const ppm = radiusPix / (radiusMiles || 1); // pix per mile
            const scale = Math.max(.33, Math.min(1, .3*Math.log10(ppm)));
            const radius = (2.5 - 1.5*Math.exp(1 * relaxation))*16*scale*1609/ppm;

            for (const c of circles) map.removeLayer(c);
            const color = '#006786';
            const activeColor = '#86007d';
            circles = state.venues.map(v => L.circle([v.latitude, v.longitude], {
                color: state.venueid === v.id ? activeColor : color,
                fillColor: state.venueid === v.id ? activeColor : color,
                radius
            })
                .on('click', () => {
                    state.venueid = v.id;
                    urlSearch.set('venue', v.id);
                    history.replaceState({}, '', '#' + urlSearch.toString())
                    renderMap();
                })
            );
            circles.forEach((c, i) => {
                const v = state.venues[i];
                c.addTo(map);
                c.setStyle({
                    weight: state.venueid ? (v.id === state.venueid ? 5 : 2) : 3,
                    opacity: v.id === state.venueid ? .5 : .2
                 })
            });
        };
        renderMap();
        map.on('zoom', renderMap);

        const isApple = () => navigator.userAgent.match(/Version\/[\d\.]+.*Safari/);
        const mapUrl = (v) => {
            if (!v?.latitude || !v?.longitude) return '';
            return (isApple() ? 'https://maps.apple.com/?ll=' : 'https://www.google.com/maps?q=') + (v.latitude.toFixed(5) + ',' + v.longitude.toFixed(5)) +
                (v.name && isApple() ? '&q=' + v.name.replace(/[ &?]/g, '+') : '');
        };

        const templatitudee = html`
<h3>${() => venuesByID[state.venueid]?.name ?? ''}</h3>

<a class="pin" style="${() => state.venueid ? '' : 'display: none'}" href="${() => mapUrl(venuesByID[state.venueid])}" title="View in map app" target="_blank">
    ${() => state.venueid ? ('📍' + venuesByID[state.venueid]?.address) : '[📍view in map app]'}
</a>

<a style="${() => state.venueid ? '' : 'display: none'}" href="${() => '../?venue='+state.venueid}">[view schedule]</a>

<h5><a href="../">${() => pubcalendar.publicname}</a>
    ${() => state.venueid ? '' : ' - All Venues'}
</h5>
<nav>
    <a href="/">🏠</a>
</nav>
        `;

        templatitudee(document.querySelector('.ui'));
    </script>
</body>
