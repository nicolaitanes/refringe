{{> header title="Sign Up" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="Sign Up" }}

<div class="ma1">
  <form class="submitonce" action="/user" method="POST" enctype="multipart/form-data">
    <div class="formfields">
      <label for="username">Username:</label>
      <input type="text" name="username" id="username" value="{{user.username}}">
      <label for="password">Password:</label>
      <input type="password" name="password" id="password">
      <button type="button" class="togglecleartext">👁</button>
      <label for="fullname">Full Name:</label>
      <input type="text" name="fullname" id="fullname" value="{{user.fullname}}">
      <label for="phone">Phone:</label>
      <input type="text" name="phone" id="phone" value="{{user.phone}}">
      <label for="email">Email:</label>
      <input type="text" name="email" id="email" value="{{user.email}}">

      {{#each answers}}
        {{> answer-edit item=this }}
      {{/each}}
    </div>
    <p><label for="robot">Robot test</label> -- Please enter the following word: <span class="robotest">"laced"</span></p>
    <input type="text" name="robot" id="robot" value="{{user.robot}}">
    <div class="flex flex-row justify-center">
      <button type="submit" style="width: min(95vw, 22em); margin: 1em 0;">Sign Up</button>
    </div>
  </form>

  {{#if message}}
  <p class="{{severity}}">{{message}}</p>
  {{/if}}

</div>
