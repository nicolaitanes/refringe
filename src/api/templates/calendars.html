{{> header title="Manage Events" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="Manage Events" }}

<div class="ma1 calendar-mgt">
  <div>
    <label><input type="checkbox" v-model="showInactive">Show Inactive</label>
  </div>
  
  <template v-if="errorMessage">
    <div class="error">[[ errorMessage ]]</div>
  </template>
  
  <template v-for="cal of calendars">
    <form v-if="cal.editing" @submit="$event.preventDefault(); saveCalendar(cal)">
      <div class="formfields">
        <label for="active">Active</label>
        <input id="active" name="active" type="checkbox" v-model="cal.newActive">
        <label for="name">Working Title:</label>
        <input id="name" name="name" type="text" v-model="cal.newName" required>
        <label for="startdate">Start:
          <input id="startdate" name="startdate" type="date" v-model="cal.newStartdate"></label>
        <label for="enddate">End:
          <input id="enddate" name="enddate" type="date" v-model="cal.newEnddate"></label>
        <label><input id="ispublic" name="ispublic" type="checkbox" v-model="cal.newIspublic"> Published under key:</label>
        <input id="key" name="key" type="text" v-model="cal.newKey" :required="ispublic">
        <label for="publicname">Public Title:</label>
        <input id="publicname" name="publicname" type="text" v-model="cal.newPublicname">
        <label for="notes" class="twofields">Notes:</label>
        <textarea id="notes" name="notes" v-model="cal.newNotes" class="twofields"></textarea>
        <label for="callforwork" class="twofields">Call For Work:</label>
        <textarea id="callforwork" name="callforwork" v-model="cal.newCallforwork" class="twofields"></textarea>
        <label for="deadline">Deadline:</label>
        <input id="deadline" name="deadline" type="date" v-model="cal.newDeadline">
        <label><input id="calling_users" name="calling_users" type="checkbox" v-model="cal.newCalling_users"> Calling members</label>
        <label><input id="calling_public" name="calling_public" type="checkbox" v-model="cal.newCalling_public"> Calling the public</label>
        <!-- TODO button to email members with call for work -->
      </div>

      <template v-if="cal.errorMessage">
        <div class="error">[[ cal.errorMessage ]]</div>
      </template>
      
      <button :disabled="cal.issaving" type="button" @click="cancelEdit(cal)">Cancel</button>
      <button :disabled="cal.issaving">Save</button>
    </form>
    <div v-else :class="{ 'calendar-summary': true, inactive: !cal.active }">
      <h3>[[ cal.publicname || cal.name || '(no name)' ]][[ !cal.publicname || cal.publicname === cal.name ? '' : '('+cal.name+')' ]]</h3>
      <div v-html="cal.notesHTML || ''"></div>
      <div v-if="cal.startdate || cal.enddate">
        <i>[[ formatDate(cal.startdate) || '' ]] - [[formatDate(cal.enddate) || '' ]]</i>
      </div>
      <div v-if="cal.ispublic">
        Published under key: <a :href="'events/' + cal.key">[[ cal.key ]]</a>
      </div>
      <div v-if="cal.callforwork">
        <b>Call for work:</b>
        <i v-if="cal.calling_users">(Members)</i>
        <i v-if="cal.calling_public">(Public)</i>
        <div v=html="cal.callforworkHTML || ''"></div>
      </div>
      <div v-if="cal.deadline">
        <b>Deadline: [[ formatDate(cal.deadline) ]]</b>
      </div>
      <button @click="editCalendar(cal)">Edit</button>
      <a :href="cal.id" title="Schedule Shows">Schedule Shows</a>
    </div>
  </template>
  <button @click="addCalendar()">+ New Event</button>
</div>

<script type="module">
    import { computed, createApp, ref } from 'vue';

    function readDate(dateString) {
        if (dateString instanceof Date) return dateString;
        return new Date(dateString + 'T00:00:00');
    }
    function readTime(timeString) {
        if (!timeString) return null;
        if (timeString instanceof Date) return timeString;
        const [hours, minutes] = timeString.split(':');
        const date = new Date();
        date.setHours(parseInt(hours), parseInt(minutes));
        return date;
    }

    let nextFakeID = -1;

    const resetEdits = (cal, editing = false) => Object.assign(cal, {
        editing,
        errorMessage: '',
        newActive: cal.active,
        newName: cal.name,
        newNotes: cal.notes,
        newStartdate: cal.startdate,
        newEnddate: cal.enddate,
        newDeadline: cal.deadline,
        newCallforwork: cal.callforwork,
        newCalling_public: cal.calling_public,
        newCalling_users: cal.calling_users,
        newPublicname: cal.publicname,
        newKey: cal.key,
        newIspublic: cal.ispublic,
        newPriority: cal.priority
    });

    const fromEdits = (cal) => ({
        ...cal,
        editing: false,
        active: cal.newActive,
        name: cal.newName,
        notes: cal.newNotes,
        startdate: cal.newStartdate,
        enddate: cal.newEnddate,
        deadline: cal.newDeadline,
        callforwork: cal.newCallforwork,
        calling_public: cal.newCalling_public,
        calling_users: cal.newCalling_users,
        publicname: cal.newPublicname,
        key: cal.newKey,
        ispublic: cal.newIspublic,
        priority: cal.newPriority
    });

    async function makeApiCall(path, params=null, method='GET') {
        const fullpath = '/calendars' + path;
        const headers = {
            Accept: 'application/json',
            'Content-Type': 'application/json'
        };
        const response = await (method === 'GET'
             ? fetch(fullpath, { method, headers, params })
             : fetch(fullpath, { method, headers, body: JSON.stringify(params) })
        );
        if (response.status === 204) return;
        if (response.status === 200) return await response.json();
        const errBody = await response.text();
        const err = new Error('Request Failed');
        try {
            err.details = JSON.parse(errBody);
        } catch (e) {
            err.details = errBody;
        }
        throw err;
    }
  
    const TestApp = {
        delimiters: ['[[', ']]'],
        setup() {
            const allCalendars = ref(JSON.parse(`{{{ calendars }}}`));
            for (const cal of allCalendars.value) resetEdits(cal);
            const errorMessage = ref('');
            const showInactive = ref(false);
            const calendars = computed(() => (showInactive.value
                ? allCalendars.value
                : allCalendars.value.filter(c => c.active)
            ).map(c => Object.assign(c, {
                startdate: readDate(c.startdate),
                enddate: readDate(c.enddate),
                deadline: readDate(c.deadline)
            })));
  
            return {
                allCalendars,
                calendars,
                errorMessage,
                showInactive
            };
        },
        methods: {
            formatDate(dateString) {
                if (!dateString) return '';
                const date = readDate(dateString);
                return `${date.getMonth() + 1}/${date.getDate()}/${date.getFullYear()-2000}`;
            },
            formatTime(timeString) {
                return readTime(timeString).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            },
            addCalendar() {
                this.allCalendars.push(resetEdits({
                    editing: true,
                    id: nextFakeID--,
                    active: true,
                    name: '',
                    notes: '',
                    startdate: null,
                    enddate: null,
                    deadline: null,
                    callforwork: '',
                    calling_public: false,
                    calling_users: false,
                    publicname: null,
                    key: null,
                    ispublic: false,
                    priority: 100
                }, true));
            },
            editCalendar(cal) {
                cal.editing = true;
            },
            cancelEdit(cal) {
                resetEdits(cal);
            },
            async saveCalendar(cal) {
                cal.errorMessage = '';
                const edited = fromEdits(cal);
                cal.issaving = true;
                try {
                    const saved = Number.isFinite(cal.id)
                        ? await makeApiCall('/', edited, 'POST')
                        : await makeApiCall('/' + cal.id, edited, 'PUT');
                    this.allCalendars.splice(this.allCalendars.findIndex(c => c.id === cal.id), 1, resetEdits(saved));
                } catch (err) {
                    cal.errorMessage = typeof err.details === 'string' ? err.details : err.message;
                }
                cal.issaving = false;
            }
        },
    };

    createApp(TestApp).mount('div.calendar-mgt');

</script>
