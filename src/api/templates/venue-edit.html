{{> header title="Edit Venue" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="Edit Venue" }}

<div class="ma1">
    <form action="/venues/{{venue.id}}" method="POST" enctype="multipart/form-data">
        <div class="formfields">
            {{#if isOrg}}
            <label for="active" class="twofields">
              <input type="checkbox" name="active" id="active" {{#if venue.active}}checked{{/if}}>
              Active
            </label>
            <label>Tags:</label>
            <tag-chip entity-type="venue" :entityid="'{{venue.id}}'" class-name="venue-tags"></tag-chip>
            <notes-button level="{{auth.l}}" venueid="{{venue.id}}" style="position: absolute; top: .5em; right: .5em;"></notes-button>
            {{/if}}

            <label for="name">Name:</label>
            <input type="text" name="name" id="name" value="{{venue.name}}">
            <label for="address">Street Address:</label>
            <input type="text" name="address" id="address" value="{{venue.address}}">
            <label for="city">City:</label>
            <input type="text" name="city" id="city" value="{{venue.city}}">
            <label for="state">State:</label>
            <input type="text" name="state" id="state" value="{{venue.state}}">
            <label for="zip">Zip:</label>
            <input type="text" name="zip" id="zip" value="{{venue.zip}}">
            <label for="latitude">Latitude:</label>
            <input type="text" name="latitude" id="latitude" value="{{venue.latitude}}">
            <label for="longitude">Longitude:</label>
            <input type="text" name="longitude" id="longitude" value="{{venue.longitude}}">
            <label for="phone">Phone:</label>
            <input type="text" name="phone" id="phone" value="{{venue.phone}}">
            <label for="email">Email:</label>
            <input type="text" name="email" id="email" value="{{venue.email}}">
            <label for="website">Website:</label>
            <input type="text" name="website" id="website" value="{{venue.website}}">

            {{#each questions}}
                {{> answer-edit item=this }}
            {{/each}}
        </div>

        <h3>Events:</h3>

        <div class="flex flex-column gap-1">
          <div>
            <label><input name="allcalendars" id="allcalendars" type="checkbox" checked="{{ allcalendars }}"><i>All Events</i></label>
          </div>
          {{#each events}}
          <div class="flex flex-column">
            <label>
              <input name="c_{{id}}" type="checkbox" checked="{{ active }}">>{{name}}
            </label>
            <div>{{ startdate }} - {{ enddate }}</div>
            <div>{{ notes }}</div>
          {{/each}}
        </div>
        
        <div class="flex flex-row justify-center">
            <button type="submit" style="width: min(95vw, 22em); margin: 1em 0;">Save</button>
        </div>
    </form>
</div>
