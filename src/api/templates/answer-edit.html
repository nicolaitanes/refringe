{{#with item}}
    {{#if isTextarea}}
        <label for="{{ fieldname }}" style="grid-column-start: 1; grid-column-end: 3;">{{ question }}</label>
        <textarea name="{{ fieldname }}" id="{{ fieldname }}" {{#if required}}required{{/if}} {{#if pattern}}pattern="{{ pattern }}"{{/if}}>{{ answer }}</textarea>
    {{else}}
        <label for="{{ fieldname }}">{{ question }}</label>
        {{#if isChoices}}
            <span class="radiogroup">
                {{#each choices}}
                <label><input type="radio" name="{{ fieldname }}" id="{{ fieldname }}" value="{{ this }}"> {{ this }}</label>
                {{/each}}
            </span>
        {{else}}
            {{#if isYesno}}
                <span class="radiogroup">
                <label><input type="radio" name="{{ fieldname }}" id="{{ fieldname }}" value="true"> Yes</label>
                <label><input type="radio" name="{{ fieldname }}" id="{{ fieldname }}" value="False"> No</label>
                </span>
            {{else}}
                <input type="text" name="{{ fieldname }}" id="{{ fieldname }}" value="{{ answer }}" {{#if required}}required{{/if}} {{#if pattern}}pattern="{{ pattern }}"{{/if}}>
            {{/if}}
        {{/if}}
    {{/if}}

    {{#if children}}
        <details class="children" style="grid-column-start: 1; grid-column-end: 3;">
            <div class="formfields">
                {{#each children}}
                    {{> answer-edit item=this }}
                {{/each}}
            </div>
        </details>
    {{/if}}
{{/with}}
