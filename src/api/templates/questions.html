{{> header title="Edit Questions" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="Edit Questions" }}

<style>
  .question.inactive .question-text {
      text-decoration: line-through;
  }
</style>

<div class="ma1 question-mgt">
    <template v-for="section of sections">
        <div class="section">
            <h2>[[ section.title ]]</h2>
            <template v-for="q of section.questions">
                <div :class="{ question : true, inactive: !q.active }">
                    <div class="question-text">
                        [[ q.required ? '*' : '' ]][[ q.question ]]
                    </div>
                    <div class="question-controls">
                        <button @click="editQuestion(q)">Edit</button>
                        <button @click="addFollowup(q)">Add Followup</button>
                    </div>
                    <div v-if="q.editing" class="question-edit">
                      <div class="formfields">
                        <label class="twofields"><input type="checkbox" v-model="q.newActive"> Active</label>
                        <label class="twofields" >Question:</label> <input class="twofields" type="text" v-model="q.newQuestion">
                        <label>Field Name: <input type="text" v-model="q.newFieldname"></label>
                        <label>Field Type:
                            <select v-model="q.newFieldtype">
                                <option value="">Text</option>
                                <option value="textarea">Textarea</option>
                                <option value="yesno">Yes/No</option>
                            </select>
                        </label>
                        <label>Priority:</label> <input type="number" v-model="q.newPriority">
                        <label>Choices (comma-separated):</label> <input type="text" v-model="q.newChoices">
                        <label>Pattern:</label> <input type="text" v-model="q.newPattern">
                        <label><input type="checkbox" v-model="q.newRequired"> Required</label>
                        <label><input type="checkbox" v-model="q.newPublic"> Public</label>
                      </div>
                      <button @click="saveQuestion(q)">Save</button>
                      <button @click="q.editing = false">Cancel</button>
                    </div>
                    <div v-if="q.adding" class="question-add">
                      <div class="formfields">
                        <label class="twofields">Question:</label> <input class="twofields" type="text" v-model="q.newQuestion">
                        <label>Field Name: <input type="text" v-model="q.newFieldname"></label>
                        <label>Field Type:
                            <select v-model="q.newFieldtype">
                                <option value="">Text</option>
                                <option value="textarea">Textarea</option>
                                <option value="yesno">Yes/No</option>
                            </select>
                        </label>
                        <label>Priority:</label> <input type="number" v-model="q.newPriority">
                        <label>Choices (comma-separated):</label> <input type="text" v-model="q.newChoices">
                        <label>Pattern:</label> <input type="text" v-model="q.newPattern">
                        <label><input type="checkbox" v-model="q.newRequired"> Required</label>
                        <label><input type="checkbox" v-model="q.newPublic"> Public</label>
                      </div>
                      <button @click="saveNewQuestion(section.key, q)">Save</button>
                      <button @click="q.adding = false">Cancel</button>
                    </div>
                    <template v-for="qq of q.children">
                      <div class="question ml2 pa1" :class="{ inactive: !qq.active }">
                        <div class="question-text">
                          [[ qq.required ? '*' : '' ]][[ qq.question ]]
                        </div>
                        <div class="question-controls">
                          <button @click="editQuestion(qq)">Edit</button>
                        </div>
                        <div v-if="qq.editing" class="question-edit">
                          <div class="formfields">
                            <label class="twofields"><input type="checkbox" v-model="qq.newActive"> Active</label>
                            <label class="twofields" >Question:</label> <input class="twofields" type="text" v-model="qq.newQuestion">
                            <label>Field Name: <input type="text" v-model="qq.newFieldname"></label>
                            <label>Field Type:
                              <select v-model="qq.newFieldtype">
                                <option value="">Text</option>
                                <option value="textarea">Textarea</option>
                                <option value="yesno">Yes/No</option>
                              </select>
                            </label>
                            <label>Priority:</label> <input type="number" v-model="qq.newPriority">
                            <label>Choices (comma-separated):</label> <input type="text" v-model="qq.newChoices">
                            <label>Pattern:</label> <input type="text" v-model="qq.newPattern">
                            <label><input type="checkbox" v-model="qq.newRequired"> Required</label>
                            <label><input type="checkbox" v-model="qq.newPublic"> Public</label>
                          </div>
                          <button @click="saveQuestion(qq)">Save</button>
                          <button @click="qq.editing = false">Cancel</button>
                        </div>
                        <div v-if="qq.adding" class="question-add">
                          <div class="formfields">
                            <label class="twofields">Question:</label> <input class="twofields" type="text" v-model="qq.newQuestion">
                            <label>Field Name: <input type="text" v-model="qq.newFieldname"></label>
                            <label>Field Type:
                              <select v-model="qq.newFieldtype">
                                <option value="">Text</option>
                                <option value="textarea">Textarea</option>
                                <option value="yesno">Yes/No</option>
                              </select>
                            </label>
                            <label>Priority:</label> <input type="number" v-model="qq.newPriority">
                            <label>Choices (comma-separated):</label> <input type="text" v-model="qq.newChoices">
                            <label>Pattern:</label> <input type="text" v-model="qq.newPattern">
                            <label><input type="checkbox" v-model="qq.newRequired"> Required</label>
                            <label><input type="checkbox" v-model="qq.newPublic"> Public</label>
                          </div>
                          <button @click="saveNewQuestion(section.key, qq)">Save</button>
                          <button @click="qq.adding = false">Cancel</button>
                        </div>
                      </div>
                    </template>
                </div>
            </template>
        </div>

        <!-- Add question button -->
        <button @click="addQuestion(section.key)">Add Question</button>
    </template>
</div>

<script type="module">
    import { computed, createApp, ref } from 'vue';

    const TestApp = {
        delimiters: ['[[', ']]'],
        setup() {
            // injected JSON from the server, containing top-level questions with optional `.children` arrays for followup questions
            const questions = ref(JSON.parse(`{{{ questions }}}`));
            const proposalQuestions = computed(() => questions.value.filter(q => q.forproposal));
            const userQuestions = computed(() => questions.value.filter(q => q.foruser));
            const venueQuestions = computed(() => questions.value.filter(q => q.forvenue));
            const sections = computed(() => ({
                proposal: {
                    key: 'forproposal',
                    title: "Proposal Questions",
                    questions: proposalQuestions.value
                },
                user: {
                    key: 'foruser',
                    title: "User Questions",
                    questions: userQuestions.value
                },
                venue: {
                    key: 'forvenue',
                    title: "Venue Questions",
                    questions: venueQuestions.value
                }
            }));

            return {
                questions,
                sections
            };
        },
        methods: {
            addQuestion(sectionKey) {
                this.questions.push({
                    id: sectionKey,
                    parentid: null,
                    adding: true,
                    newQuestion: '',
                    newFieldname: '',
                    newFieldtype: '',
                    newPriority: 1,
                    newChoices: '',
                    newPattern: '',
                    newRequired: false,
                    newPublic: true,
                    [sectionKey]: true
                });
            },
            addFollowup(parentQuestion) {
                if (!parentQuestion.children) {
                    parentQuestion.children = [];
                }
                parentQuestion.children.push({
                    adding: true,
                    parentid: parentQuestion.id,
                    newQuestion: '',
                    newFieldname: '',
                    newFieldtype: '',
                    newPriority: 1,
                    newChoices: '',
                    newPattern: '',
                    newRequired: false,
                    newPublic: true
                });
            },
            editQuestion(question) {
                question.newActive = question.active;
                question.newQuestion = question.question;
                question.newFieldname = question.fieldname;
                question.newFieldtype = question.fieldtype;
                question.newPriority = question.priority;
                question.newChoices = question.choices ? question.choices.join(', ') : '';
                question.newPattern = question.pattern;
                question.newRequired = question.required || false;
                question.newPublic = question.newPublic || false;
                question.editing = true;
            },
            async saveNewQuestion(sectionKey, question) {
                const newQuestion = {
                    question: question.newQuestion,
                    fieldname: question.newFieldname,
                    fieldtype: question.newFieldtype,
                    priority: question.newPriority,
                    choices: question.newChoices ? question.newChoices.split(',').map(s => s.trim()) : null,
                    pattern: question.newPattern,
                    required: question.newRequired || false,
                    ispublic: question.newPublic || false,
                    parentid: question.parentid || null,
                    [sectionKey]: true
                };
                await fetch('/questions/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newQuestion)
                });
                this.questions.splice(this.questions.findIndex(q => q.id === sectionKey), 1, newQuestion);
            },
            async saveQuestion(question) {
                const updatedQuestion = {
                    ...question,
                    editing: false,
                    id: question.id,
                    parentid: question.parentid,
                    active: question.newActive,
                    question: question.newQuestion,
                    fieldname: question.newFieldname,
                    fieldtype: question.newFieldtype,
                    priority: question.newPriority,
                    choices: question.newChoices ? question.newChoices.split(',').map(s => s.trim()) : null,
                    pattern: question.newPattern,
                    required: question.newRequired || false,
                    ispublic: question.newPublic || false,
                };
                await fetch(`/questions/${question.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(updatedQuestion)
                });
                this.questions.splice(this.questions.findIndex(q => q.id === question.id), 1, updatedQuestion);
            },
        }
    }

  createApp(TestApp).mount('div.question-mgt');

</script>
