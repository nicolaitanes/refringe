{{> header title="All Proposals" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="All Proposals" }}

<div class="ma1 proposal-mgt">
    <h3>All Proposals</h3>
    
    <table class="table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Notes</th>
            <th>Tags</th>
            <th>Updated</th>
        </tr>
        </thead>
        <tbody>
        {{#each proposals as |prop|}}
        <tr>
            <td><a href="/proposals/{{prop.id}}">{{prop.title}}</a></td>
            <td>{{prop.fullname}}</td>
            <td><notes-button level="{{auth.l}}" proposalid="{{prop.id}}"></notes-button></td>
            <td><tag-chip entity-type="proposal" :entityid="'{{prop.id}}'" class-name="proposal-tags"></tag-chip></td>
            <td>{{prop.updated}}</td>
        </tr>
        {{/each}}
        </tbody>
    </table>
</div>

<script type="module">
    import { createApp } from 'vue';
    import NotesButton from 'notesButton';
    import TagChip from 'tagChip';

    const TestApp = {
        components: {
            NotesButton,
            TagChip
        },
        delimiters: ['[[', ']]'],
    }
    createApp(TestApp).mount('div.proposal-mgt');
</script>
