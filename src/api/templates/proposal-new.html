{{> header title="New Proposal - Allentown ReFringe" }}
{{> breadcrumb title="New Proposal" }}

<div class="ma1">
    <form action="/proposals" method="POST" enctype="multipart/form-data">
        <div class="formfields">
            <label for="title">Title:</label>
            <input type="text" name="title" id="title" value="{{proposal.title}}">

            {{#each questions}}
                {{> answer-edit item=this }}
            {{/each}}
        </div>
        <div class="flex flex-row justify-center">
            <button type="submit" style="width: min(95vw, 22em); margin: 1em 0;">Save</button>
        </div>
    </form>
</div>
