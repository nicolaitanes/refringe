{{> header title="New Proposal" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="New Proposal" }}

<div class="ma1">
    <form class="submitonce" action="/proposals" method="POST" enctype="multipart/form-data">
        <div class="formfields">
            <label for="title">Proposal Title:</label>
            <input type="text" name="title" id="title" value="{{proposal.title}}">
            <label for="stagename">Stage Name:</label>
            <input type="text" name="stagename" id="stagename" value="{{proposal.stagename}}">

            {{#each questions}}
                {{> answer-edit item=this }}
            {{/each}}
        </div>

        <h3>Events:</h3>

        <div class="flex flex-column gap-1">
          <div>
            <label><input name="allcalendars" id="allcalendars" type="checkbox" checked="{{ allcalendars }}"><i>All Events</i></label>
          </div>
          {{#each events}}
          <div class="flex flex-column">
            <label>
              <input name="c_{{id}}" type="checkbox" checked="{{ active }}">{{name}}
            </label>
            <div>{{ startdate }} - {{ enddate }}</div>
            <div>{{ notes }}</div>
          {{/each}}
        </div>
        
        <div class="flex flex-row justify-center">
            <button type="submit" style="width: min(95vw, 22em); margin: 1em 0;">Save</button>
        </div>
    </form>
</div>
