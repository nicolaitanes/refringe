<!DOCTYPE html>

<html>
  <head>
    <title>{{ title }}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width">

    <meta property="og:title" content="Allentown ReFringe" />
    <meta property="og:description" content="Collaborative Arts Showcase" />
    <meta property="og:site_name" content="ReFringe.org" />
    <meta property="og:url" content="https://refringe.mandelics.com" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://refringe.mandelics.com/img/refringe-ogp2.jpg" />
    <meta property="og:image:alt" content="ReFringe Flyer" />

    <script type="importmap">
    {
        "imports": {
            "vue": "/js/vue.esm-browser.3.5.38.prod.js"
        }
    }
    </script>

    <link href="/tachyons.min.css" rel="stylesheet" />
    <style>
      html {
        box-sizing: border-box;
      }
      *, *:before, *:after {
        box-sizing: inherit;
      }
      body {
      --bg: #fff;
      --menu-bg: #ccc;
      --fg: #111;
      --btn: #20a;
      --btn-hover: #32a;
      --btn-active: #109;
      --btn-fg: #ddd;
      --link: #20a;
      --blurb: #750;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: sans-serif;
        height: 100vh;
        display: flex;
        flex-flow: column nowrap;
      }
      body > .ma1 {
          flex: 1 1 auto;
          position: relative;
      }
      @media (prefers-color-scheme: dark) {
      body {
      --bg: #111;
      --menu-bg: #444;
      --fg: #ddd;
      --link: #ddf;
      --blurb: #f8f605;
      }
      }
      a, a:visited, a:active, a:hover {
        color: var(--link);
      }
      .main {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        display: flex;
        flex-flow: column nowrap;
      }
      nav.bar ul {
        display: flex;
        flex-flow: row wrap;
        margin: 0;
        padding: 0;
        list-style-type: none;
      }
      nav.bar li {
        flex: 1 0 15rem;
        display: flex;
      }
      nav.bar a.nav {
        display: inline-block;
        flex-grow: 1;
        text-decoration: none;
        margin: 1px;
        border: 1px solid var(--btn-hover);
        padding: .62rem;
        font-size: 1.5rem;
        font-weight: 700;
        background: var(--btn);
        min-width: 15rem;
        text-align: center;
        color: var(--btn-fg);
      }
      nav.bar a.nav:hover {
        background: var(--btn-hover);
        color: var(--btn-fg);
      }
      nav.bar a:active {
        background: var(--btn-active);
        color: var(--btn-fg);
      }
      nav.bar a:focus, nav.bar a:hover {
        background: var(--btn-hover);
        color: var(--btn-fg);
      }
      .robotest {
        direction: rtl;
        unicode-bidi: bidi-override;
      }
      .usermenu {
        position: fixed;
        top: .5rem;
        right: .5rem;
        z-index: 10;
        & > span {
          display: none;
        }
      }
      [popover] {
        background: var(--menu-bg);
        color: var(--fg);
        border: 1px solid var(--fg);
      }
      #avatarmenu {
        position: fixed;
        margin: 0;
        padding: 0;
        inset: auto;
        top: 3rem;
        right: .5rem;
        list-style: none;
        min-width: 12em;
     }
     .gap-1 {
         gap: .25em;
     }
     .gap-2 {
         gap: .5em;
     }
     .gap-3 {
         gap: 1em;
     }
     .formfields {
         display: grid;
         grid-template-columns: auto 1fr;
         gap: .5em;
         align-items: baseline;
         margin-top: 1em;
    }
    #password,
    #passwordChange {
        anchor-name: --password-input;
    }
    .togglecleartext {
        display: none;
        position: absolute;
        position-anchor: --password-input;
        position-area: center right;
        margin-left: -2em;
        border-radius: .25em;
        background: transparent;
    }
    </style>
    <script>
      window.addEventListener('load', () => {
          for (const btn of document.querySelectorAll('.togglecleartext')) {
              btn.style.display = 'block';
              const pw = btn.parentNode.querySelector('#password') ??
                    btn.parentNode.querySelector('#passwordChange');
              btn.addEventListener('click', ev => {
                  pw.type = pw.type === 'password' ? 'text' : 'password';
              });
          }
          for (const form of document.querySelectorAll('form.submitonce')) {
              form.addEventListener('submit', ev => {
                  ev.submitter.disabled = true;
              });
          }
      });
    </script>
  </head>
  <body>

   {{#if auth.u}}
    <div class="usermenu flex flex-row gap-2 f3">
      <span>{{auth.n}}</span>
      <button class="avatar" popovertarget="avatarmenu">🫅</button>
    </div>
    <ul id="avatarmenu" popover>
      <li class="pa2 bb"><a href="/menu">Main Menu</a></li>
      {{#if isAdmin}}
          <li class="pa2 bb"><a href="/config">Configuration</a></li>
      {{/if}}
      <li class="pa2 bb"><a href="/user/{{auth.u}}">My Profile</a></li>
      <li class="pa2"><a href="/logout">Log Out</a></li>
    </ul>
   {{/if}}
