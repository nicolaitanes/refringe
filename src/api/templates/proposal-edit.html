{{> header title="Edit Proposal" sitename=sitename opengraph=opengraph }}
{{> breadcrumb title="Edit Proposal" }}

<div class="ma1">
    <form action="/proposals/{{ proposal.id }}" method="POST" enctype="multipart/form-data">
        <div class="formfields">
            {{#if isOrg}}
            <label for="active" class="twofields">
              <input type="checkbox" name="active" id="active" {{#if proposal.active}}checked{{/if}}>
              Active
            </label>
            <label>Tags:</label>
            <tag-chip entity-type="proposal" :entityid="'{{proposal.id}}'" class-name="proposal-tags"></tag-chip>
            <notes-button level="{{auth.l}}" proposalid="{{proposal.id}}" style="position: absolute; top: .5em; right: .5em;"></notes-button>
            {{/if}}

            <label for="title">Title:</label>
            <input type="text" name="title" id="title" value="{{proposal.title}}">

            {{#each questions}}
                {{> answer-edit item=this }}
            {{/each}}
        </div>

        <h3>Events:</h3>

        <div class="flex flex-column gap-1">
          <div>
            <label><input name="allcalendars" id="allcalendars" type="checkbox" checked="{{ allcalendars }}"><i>All Events</i></label>
          </div>
          {{#each events}}
          <div class="flex flex-column">
            <label>
              <input name="c_{{id}}" type="checkbox" checked="{{ active }}">{{name}}
            </label>
            <div>{{ startdate }} - {{ enddate }}</div>
            <div>{{ notes }}</div>
          {{/each}}
        </div>
        
        <div class="flex flex-row justify-center">
            <button type="submit" style="width: min(95vw, 22em); margin: 1em 0;">Save</button>
        </div>
    </form>
</div>
